name: Build and Release ESP32 Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate firmware version header
        run: |
          printf '#pragma once\n#define FW_VERSION "%s"\n' "${GITHUB_REF_NAME}" > src/build_version.h
          cat src/build_version.h

      - name: Build firmware
        run: pio run -e nodemcu-32s

      - name: Verify firmware file
        run: |
          ls -lh .pio/build/nodemcu-32s/
          test -f .pio/build/nodemcu-32s/firmware.bin

      - name: Prepare release file
        run: |
          cp .pio/build/nodemcu-32s/firmware.bin firmware.bin

      - name: Prepare release notes
        run: |
          git fetch --force --tags
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf 'ESP32 firmware %s\n' "${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Create GitHub Release and upload firmware.bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
            gh release upload "${GITHUB_REF_NAME}" firmware.bin --clobber
          else
            gh release create "${GITHUB_REF_NAME}" firmware.bin \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md \
              --verify-tag
          fi
