name: Build and Release ESP32 Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize release jobs for the same ref so duplicate tag-push events cannot
# race while creating/updating the same GitHub Release.
concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate firmware version header
        run: |
          printf '#pragma once\n#define FW_VERSION "%s"\n' "${GITHUB_REF_NAME}" > src/build_version.h
          cat src/build_version.h

      - name: Build firmware
        run: pio run -e nodemcu-32s

      - name: Verify firmware file
        run: |
          ls -lh .pio/build/nodemcu-32s/
          test -f .pio/build/nodemcu-32s/firmware.bin

      - name: Prepare release file
        run: |
          cp .pio/build/nodemcu-32s/firmware.bin firmware.bin

      - name: Prepare release notes
        run: |
          NOTES_FILE="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "ERROR: ${NOTES_FILE} is missing or empty" >&2
            exit 1
          fi
          cp "${NOTES_FILE}" release_notes.md
          echo "Using ${NOTES_FILE} for GitHub release and OTA manifest"

      - name: Prepare OTA manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          notes = Path("release_notes.md").read_text(encoding="utf-8")

          # Keep the OTA manifest deliberately compact. The full release notes can
          # be large (v0.4.x includes the complete AsyncWebServer migration
          # history), while older installed firmware reads the manifest into a
          # single String. Only the summary/highlights belong in the OTA payload;
          # the complete notes stay attached to the GitHub Release.
          marker = "## AsyncWebServer migration history"
          ota_notes = notes.split(marker, 1)[0].rstrip()
          if marker in notes:
              ota_notes += "\n\nFull migration history: see the GitHub release notes.\n"

          manifest = {
              "version": tag,
              "firmwareUrl": f"https://github.com/syschelle/GrowTent/releases/download/{tag}/firmware.bin",
              "changelog": ota_notes,
          }
          Path("manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          cat manifest.json

      - name: Create GitHub Release and upload OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          update_release() {
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
            gh release upload "${GITHUB_REF_NAME}" firmware.bin manifest.json --clobber
          }

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            update_release
          else
            if ! gh release create "${GITHUB_REF_NAME}" firmware.bin manifest.json \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md \
              --verify-tag; then
              echo "Release creation raced with another run; retrying as update."
              sleep 3
              gh release view "${GITHUB_REF_NAME}" >/dev/null
              update_release
            fi
          fi
