name: Firmware and irrigation plan tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.2.0
      - run: python tests/test_irrigation_plan.py
      - run: python -m platformio run -e nodemcu-32s
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-test-build
          path: |
            .pio/build/nodemcu-32s/firmware.bin
            .pio/build/nodemcu-32s/firmware.elf
          if-no-files-found: error
