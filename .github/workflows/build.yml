name: Firmware and irrigation plan tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.2.0
      - run: node tests/test_local_plan_ui.mjs
      - run: node tests/test_local_plan_editor.mjs
      - run: python tests/test_irrigation_plan.py
      - run: python -m platformio run -e nodemcu-32s
      - run: python tests/test_irrigation_schedule_parser.py .pio/libdeps/nodemcu-32s/ArduinoJson/src
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-test-build
          path: |
            .pio/build/nodemcu-32s/firmware.bin
            .pio/build/nodemcu-32s/firmware.elf
          if-no-files-found: error

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_irrigation_layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irrigation-layout-previews
          path: layout-previews/*.png
          if-no-files-found: warn
